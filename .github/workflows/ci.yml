name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # Installs the Vite+ version pinned in package.json, Node from
      # .node-version, and the pinned package manager. Pinned to an exact
      # release: the moving `v1` tag is frozen at v1.15.0.
      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version-file: .node-version
          cache: "true"
          run-install: "false"

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Generate
        run: vp run generate

      - name: Lint
        run: vp run lint

      - name: Test
        run: vp test --run

      - name: Build
        run: vp build
